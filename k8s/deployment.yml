apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloworld-mibanco
  labels:
    app: helloworld-mibanco
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helloworld-mibanco
  template:
    metadata:
      labels:
        app: helloworld-mibanco
    spec:
      containers:
      - name: helloworld-mibanco
        image: ${ACR_NAME}.azurecr.io/helloworld-mibanco:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        env:
        - name: JAVA_OPTS
          value: "-Xmx384m -Xms256m"
